<!DOCTYPE html>
<html lang="zh" data-alt-href="connect-mobile.html" data-alt-label="EN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="shortcut icon" href="img/favicon.ico">
    <title>联系我们（移动版）| 美拉科斯塔学院</title>
    <meta name="description" content="手机端联系美拉科斯塔学院招生团队，获取UCPP与美式高中的最新资讯。">
    <meta name="keywords" content="美拉科斯塔 联系 移动, UCPP 咨询 移动">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/mobile.css">
    <script src="js/layout.js" defer></script>
</head>
<body class="bg-white text-gray-900">
        <div data-include="mobile-header"></div>


    <section class="hero-section relative flex items-center justify-center text-center text-white" style="--hero-image: url('img/652e4097-99e6-4d0f-a7ec-74dfa7e48db7.jpg');">
        <div class="hero-overlay absolute inset-0"></div>
        <div class="relative z-10 px-6 py-10 space-y-6 max-w-lg">
            <span class="badge">随时联系</span>
            <h1 class="hero-title font-bold leading-tight">让我们保持沟通</h1>
            <p class="hero-subtitle font-medium">招生顾问为您提供个性化方案</p>
        </div>
    </section>

    <main>
        <section class="mobile-section">
            <div class="section-wrapper">
                <h2 class="section-heading">联系方式</h2>
                <div class="card-grid two-columns">
                    <div class="info-card scroll-fade">
                        <h3>邮箱</h3>
                        <p class="text-gray-700">admission@tam-ucpp.com</p>
                    </div>
                    <div class="info-card scroll-fade">
                        <h3>电话</h3>
                        <p class="text-gray-700">+1 510-499-2449</p>
                    </div>
                    <div class="info-card scroll-fade">
                        <h3>校区</h3>
                        <p class="text-gray-700">美国加州 欧申赛德 92056</p>
                    </div>
                    <div class="info-card scroll-fade">
                        <h3>合作伙伴</h3>
                        <p class="text-gray-700">全球合作伙伴可通过招生邮箱获取专属支持。</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="mobile-section">
            <div class="section-wrapper">
                <h2 class="section-heading">申请咨询</h2>
                <div class="highlight-card scroll-fade">
                    <h3>立即申请</h3>
                    <p>准备好出发了吗？分享学生信息，我们将提供下一步指引、签证指导与课程规划建议。</p>
                    <a class="cta-button mt-2" href="mailto:admission@tam-ucpp.com?subject=UCPP%20%E7%94%B3%E8%AF%B7%E5%95%86%E8%AF%A2">发送申请邮件</a>
                </div>
                <div class="contact-card scroll-fade">
                    <p class="text-sm uppercase tracking-[0.2em] text-white/70">更喜欢微信？</p>
                    <p class="text-lg font-semibold">扫码即可与招生顾问即时沟通。</p>
                    <img src="img/652e4097-99e6-4d0f-a7ec-74dfa7e48db7.jpg" alt="招生微信二维码" class="w-48 h-48 mx-auto rounded-2xl shadow-lg">
                </div>
            </div>
        </section>

        <section class="mobile-section">
            <div class="section-wrapper">
                <h2 class="section-heading">服务时间</h2>
                <div class="info-card scroll-fade">
                    <h3>咨询时段</h3>
                    <p class="text-gray-700">周一至周五一个工作日内回复。周末留言将在下个工作日处理。</p>
                </div>
                <div class="info-card scroll-fade">
                    <h3>建议提供</h3>
                    <p class="text-gray-700">请告知学生背景、目标入学时间与问题，我们将匹配合适顾问对接。</p>
                </div>
            </div>
        </section>
    </main>

    <div data-include="mobile-footer"></div>
</body>
</html>
