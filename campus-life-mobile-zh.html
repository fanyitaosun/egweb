      "@context": "https://schema.org",

      "contactPoint": [{
        "@type": "ContactPoint",

<body class="bg-white text-gray-900">
        <div data-include="mobile-header"></div>


    <section class="hero-section relative flex items-center justify-center text-center text-white" style="--hero-image: url('img/camp5.png');">
        <div class="hero-overlay absolute inset-0"></div>
        <div class="relative z-10 px-6 py-10 space-y-6 max-w-lg">
            <span class="badge">校园亮点</span>
            <h1 class="hero-title font-bold leading-tight">探索校园生活</h1>
            <p class="hero-subtitle font-medium">课堂之外的多元成长</p>
        </div>
    </section>

    <main>
        <section class="mobile-section">
            <div class="section-wrapper">
                <h2 class="section-heading">保持活力</h2>
                <div class="info-card scroll-fade">
                    <h3>校内运动</h3>
                    <p class="text-gray-700">加入校内体育联盟或与学院团队一起组织比赛，从竞技到入门都能找到适合的队伍。</p>
                </div>
                <div class="media-block scroll-fade">
                    <img src="img/28b2c8_2dad88960d0d420ba09921e6598ec2dd~mv2.png" alt="学生进行体育活动">
                </div>
            </div>
        </section>

        <section class="mobile-section">
            <div class="section-wrapper">
                <h2 class="section-heading">共同成长</h2>
                <div class="info-card scroll-fade">
                    <h3>学生社团</h3>
                    <p class="text-gray-700">选择上百个学生社团或自行创建新社团，探索服务、领导力与学术兴趣。</p>
                </div>
                <div class="info-card scroll-fade">
                    <h3>高中社区</h3>
                    <p class="text-gray-700">高中团队定期策划专属活动，帮助学生建立紧密的伙伴关系与校园归属感。</p>
                </div>
            </div>
        </section>

        <section class="mobile-section">
            <div class="section-wrapper">
                <h2 class="section-heading">探索无限</h2>
                <div class="info-card scroll-fade">
                    <h3>特色体验</h3>
                    <p class="text-gray-700">从文化节、服务日到周末探索行程，校园总有精彩。更多活动请访问 <a href="https://miracosta.edu/student-services/" target="_blank" rel="noopener">官方学生服务网站</a>。</p>
                </div>
                <div class="contact-card scroll-fade">
                    <p class="text-sm uppercase tracking-[0.2em] text-white/70">需要推荐？</p>
                    <p class="text-lg font-semibold">联系我们的学生生活团队，获取与兴趣匹配的活动建议。</p>
                    <p class="text-sm">邮箱 <a href="mailto:admission@tam-ucpp.com">admission@tam-ucpp.com</a> 或拨打 +1 510-499-2449。</p>
                </div>
            </div>
        </section>
