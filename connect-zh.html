<!DOCTYPE html>
<html lang="zh" data-alt-href="connect.html" data-alt-label="EN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 | 美拉科斯塔学院 UCPP</title>
    <meta name="description" content="联系美拉科斯塔学院（TAM）招生团队，了解UCPP、大学转学与美式高中课程。我们为学生、家长与合作伙伴提供专属咨询。">
    <meta name="keywords" content="美拉科斯塔学院 联系, UCPP 咨询, 美国高中招生, 北美大学直通车">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/academy.css">
    <script src="js/layout.js" defer></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://www.tam-ucpp.com/#org",
      "name": "The Academy at MiraCosta (TAM) — UCPP",
      "url": "https://www.tam-ucpp.com/",
      "logo": "https://www.tam-ucpp.com/img/U-02(1).jpg",
      "contactPoint": [{
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "admission@tam-ucpp.com",
        "telephone": "+1-510-499-2449",
        "areaServed": ["CN", "US"],
        "availableLanguage": ["en", "zh"]
      }]
    }
    </script>
</head>
<body class="bg-white text-gray-900">
    <div data-include="desktop-header"></div>

    <main>
      <section class="bg-[#1D1D36] text-white">
        <div class="max-w-4xl mx-auto px-6 py-16 text-center space-y-6">
          <h1 class="text-4xl font-bold tracking-wide">与我们取得联系</h1>
          <p class="text-lg text-white/80 leading-relaxed">
            招生顾问随时为学生、家长与合作伙伴提供一对一答疑与规划建议。
          </p>
        </div>
      </section>

      <section class="py-16 bg-white">
        <div class="max-w-5xl mx-auto px-6 space-y-10">
          <div class="space-y-4 text-center">
            <h2 class="text-3xl font-semibold text-gray-900">联系方式</h2>
            <p class="text-lg text-gray-600">选择最适合您的方式与我们沟通。</p>
          </div>

          <div class="grid gap-8 md:grid-cols-3">
            <div class="rounded-2xl bg-[#7391A7] text-white p-8 space-y-4 shadow-lg">
              <h3 class="text-xl font-semibold uppercase tracking-wide">电话</h3>
              <p class="text-lg font-medium">Tel: <a href="tel:+15104992449" class="underline">+1 510-499-2449</a></p>
            </div>

            <div class="rounded-2xl bg-[#1D1D36] text-white p-8 space-y-4 shadow-lg">
              <h3 class="text-xl font-semibold uppercase tracking-wide">邮箱</h3>
              <p class="text-lg font-medium">
                <a href="mailto:admission@tam-ucpp.com" class="underline break-all">admission@tam-ucpp.com</a>
              </p>
            </div>

            <div class="rounded-2xl bg-[#7391A7] text-white p-8 space-y-4 shadow-lg flex flex-col items-center">
              <h3 class="text-xl font-semibold uppercase tracking-wide">微信</h3>
              <img src="img/652e4097-99e6-4d0f-a7ec-74dfa7e48db7.jpg" alt="招生团队微信二维码" class="w-40 h-40 rounded-lg object-cover bg-white p-2">
            </div>
          </div>
        </div>
      </section>

      <section class="py-16 bg-gray-50">
        <div class="max-w-4xl mx-auto px-6">
          <div class="bg-white rounded-3xl shadow-xl ring-1 ring-black/5 p-8 sm:p-12 space-y-10">
            <div class="space-y-3 text-center">
              <h2 class="text-3xl font-semibold text-gray-900">提交咨询表</h2>
              <p class="text-base text-gray-600">
                填写以下信息，我们将依据学生背景提供课程规划、签证与录取建议。
              </p>
            </div>

            <form id="inquiry-form" action="http://api.easyagroup.com/api/ucpp/form/submit" method="post" class="space-y-8">
              <div class="grid gap-6 sm:grid-cols-2">
                <div class="space-y-2">
                  <label for="first-name" class="block text-sm font-medium text-gray-700">名 *</label>
                  <input type="text" id="first-name" name="first-name" required class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 focus:border-[#1D1D36] focus:ring-[#1D1D36]" placeholder="如：Li">
                </div>

                <div class="space-y-2">
                  <label for="last-name" class="block text-sm font-medium text-gray-700">姓 *</label>
                  <input type="text" id="last-name" name="last-name" required class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 focus:border-[#1D1D36] focus:ring-[#1D1D36]" placeholder="如：Wang">
                </div>

                <div class="space-y-2">
                  <label for="email" class="block text-sm font-medium text-gray-700">邮箱 *</label>
                  <input type="email" id="email" name="email" required class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 focus:border-[#1D1D36] focus:ring-[#1D1D36]" placeholder="例：li.wang@gmail.com">
                </div>

                <div class="space-y-2">
                  <label for="phone" class="block text-sm font-medium text-gray-700">电话号码 *</label>
                  <input type="tel" id="phone" name="phone" required class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 focus:border-[#1D1D36] focus:ring-[#1D1D36]" placeholder="例：+86 138xxxxxxx">
                </div>

                <div class="space-y-2">
                  <label for="relationship" class="block text-sm font-medium text-gray-700">与学生关系 *</label>
                  <select id="relationship" name="relationship" required class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 focus:border-[#1D1D36] focus:ring-[#1D1D36]">
                    <option value="" disabled selected>请选择</option>
                    <option value="Parent/Guardian">家长 / 监护人</option>
                    <option value="Student">学生</option>
                    <option value="Counselor">升学顾问</option>
                    <option value="Agent">留学顾问 / 机构</option>
                    <option value="Other">其他</option>
                  </select>
                </div>

                <div id="student-name-group" class="space-y-2 hidden">
                  <label for="student-name" class="block text-sm font-medium text-gray-700">学生姓名 *</label>
                  <input type="text" id="student-name" name="student-name" class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 focus:border-[#1D1D36] focus:ring-[#1D1D36]" placeholder="请输入学生姓名">
                </div>

                <div class="space-y-2">
                  <label for="current-grade" class="block text-sm font-medium text-gray-700">当前年级 *</label>
                  <select id="current-grade" name="current-grade" required class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 focus:border-[#1D1D36] focus:ring-[#1D1D36]">
                    <option value="" disabled selected>请选择</option>
                    <option>6年级</option>
                    <option>7年级</option>
                    <option>8年级</option>
                    <option>9年级</option>
                    <option>10年级</option>
                    <option>11年级</option>
                    <option>12年级</option>
                    <option>高中毕业</option>
                    <option>间隔年</option>
                    <option>其他</option>
                  </select>
                </div>

                <div class="space-y-2">
                  <label for="start-term" class="block text-sm font-medium text-gray-700">计划入学学期 *</label>
                  <select id="start-term" name="start-term" required class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 focus:border-[#1D1D36] focus:ring-[#1D1D36]">
                    <option value="" disabled selected>请选择</option>
                    <option>2025 春季</option>
                    <option>2025 秋季</option>
                    <option>2026 春季</option>
                    <option>2026 秋季</option>
                    <option>2027 春季</option>
                    <option>2027 秋季</option>
                    <option>2028 春季</option>
                    <option>2028 秋季</option>
                  </select>
                </div>

                <div class="space-y-2 sm:col-span-2">
                  <label for="wechat" class="block text-sm font-medium text-gray-700">微信号（选填）</label>
                  <input type="text" id="wechat" name="wechat" class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 focus:border-[#1D1D36] focus:ring-[#1D1D36]" placeholder="便于招生团队联系">
                </div>
              </div>

              <div class="space-y-2">
                <label for="message" class="block text-sm font-medium text-gray-700">留言内容 *</label>
                <textarea id="message" name="message" required rows="5" class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 focus:border-[#1D1D36] focus:ring-[#1D1D36]" placeholder="请描述学生背景、目标院校或具体问题"></textarea>
              </div>

              <div class="text-center">
                <button type="submit" class="inline-flex items-center justify-center rounded-full bg-[#1D1D36] px-10 py-3 text-sm font-semibold uppercase tracking-wider text-white hover:bg-[#313158] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1D1D36]">
                  提交
                </button>
                <p id="form-feedback" class="mt-4 text-sm text-gray-600" role="status" aria-live="polite"></p>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <div data-include="desktop-footer"></div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const relationshipSelect = document.getElementById('relationship');
    const studentNameGroup = document.getElementById('student-name-group');
    const studentNameInput = document.getElementById('student-name');
    const form = document.getElementById('inquiry-form');
    const feedback = document.getElementById('form-feedback');
    const submitButton = form.querySelector('button[type="submit"]');

    const toggleStudentName = () => {
      if (!relationshipSelect.value || relationshipSelect.value === 'Student') {
        studentNameGroup.classList.add('hidden');
        studentNameInput.removeAttribute('required');
        studentNameInput.value = '';
      } else {
        studentNameGroup.classList.remove('hidden');
        studentNameInput.setAttribute('required', 'required');
      }
    };

    relationshipSelect.addEventListener('change', toggleStudentName);
    toggleStudentName();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      feedback.textContent = '';
      feedback.classList.remove('text-green-600', 'text-red-600');
      submitButton.disabled = true;
      submitButton.classList.add('opacity-60');

      try {
        const formData = new FormData(form);
        const response = await fetch(form.action, {
          method: 'POST',
          body: formData,
        });

        if (!response.ok) {
          throw new Error('Network response was not ok');
        }

        feedback.textContent = '提交成功！我们将在一个工作日内与您联系。';
        feedback.classList.remove('text-red-600', 'text-gray-600');
        feedback.classList.add('text-green-600');
        form.reset();
        toggleStudentName();
      } catch (error) {
        feedback.textContent = '提交遇到问题，请稍后重试或直接通过电话、邮箱联系我们。';
        feedback.classList.remove('text-green-600', 'text-gray-600');
        feedback.classList.add('text-red-600');
      } finally {
        submitButton.disabled = false;
        submitButton.classList.remove('opacity-60');
      }
    });
  });
</script>
<script src="js/device-redirect.js"></script>
</body>
</html>
