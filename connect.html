<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect with TAM | University Credits Pathway Program (UCPP)</title>
    <meta name="description" content="Contact The Academy at MiraCosta (TAM) to learn more about our programs, including UCPP and University Transfer pathways. Get guidance for a seamless path to top North American universities.">
    <meta name="keywords" content="contact TAM, The Academy at MiraCosta, TAM, UCPP, University Credits Pathway Program, University Transfer, North American universities">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/academy.css">
    <script src="js/layout.js" defer></script>
</head>
<body class="bg-white">
    <div data-include="desktop-header"></div>

<style>
      .a-title{
        font-size:3.75rem;
        text-align:center;
        margin-top: 1.3125rem;
        margin-bottom: 1.5625rem;
        color: #1D1D36;
      }
      .a-con{
        letter-spacing: normal;
        line-height: 20px;
        text-align: center;
        font-size: 17px;
        color: #021828;
      }
      .a-ppp{
        width: 45.75rem;
        margin: auto;
        margin-bottom: 1.25rem;
        text-align: center;
      }


    </style>
    <div>
      <h1 class="a-title">Connect</h1>
    </div>


    <div class="wrapper">
      <!-- 第1个 -->
      <section class="block block--color" id="block-1" style="background-color: #7391A7;">
        <div class="block__inner">
          <h2 class="block__title">Agent Inquiry</h2>
          <p class="block__text">
            admission@tam-ucpp.com
          </p>
        </div>
      </section>

      <!-- 第2个 -->
      <section class="block block--color" id="block-1  block-1" style="background-color: #1D1D36;">
        <div class="block__inner">
          <a href="" class="apply-btn"> Apply Now!</a>
        </div>
      </section>

      <!-- 第3个 -->
      <section class="block block--color" id="block-1" style="background-color: #7391A7;">
        <div class="block__inner">
          <h2 class="block__title">Contact</h2>
          <p class="block__text">
            admission@tam-ucpp.com
          </p>
        </div>
      </section>

    </div>
    <br><br><br><br>
    <style>
      .wrapper {
        width: 100%;              /* 固定总宽度 */
        display: flex;
        flex-wrap: wrap;            /* 自动换行 */
        gap: 0;                  /* block之间的间距，可调整 */
        margin: 0 auto;             /* 居中 */
      }

      .block {
        flex: 0 0 calc(34% - 16px); /* 两列，每个占一半（减去gap） */
        min-height: 22.5rem;
        height: 31.25rem;
        border-radius: .5rem;
        overflow: hidden;
        box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        display: flex;
        align-items: center;
        justify-content: center;
      }



      .block__inner {
        width: 100%;
        max-width: 90%;
        padding: 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .block__title {
        margin: 0;
        font-size: 40px;
        color: #FFFFFF;
        font-weight: 700;
      }

      .block__text {
        margin-top: 18px;
        font-size: 16px;
        color: #FFFFFF;
        line-height: 1.7;
      }

      .placeholder {
        margin: 0;
        padding: 12px 18px;
        background: rgba(255,255,255,0.12);
        border-radius: 6px;
        font-size: 16px;
        color: #fff;
      }

      .placeholder.dark {
        background: rgba(0,0,0,0.04);
        color: #222;
      }

      /* 第4个白色背景里的文字颜色改深色 */
      #block-4 .block__text {
        color: #fff;
      }

      .apply-btn {
        display: inline-flex;              /* 让文字垂直居中 */
        align-items: center;
        justify-content: center;
        width: 309px;
        height: 86px;
        background-color: #41637B;         /* 默认背景色 */
        color: #fff;                       /* 字体颜色 */
        font-size: 20px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 8px;                /* 圆角可调 */
        transition: background-color 0.3s ease;
      }

      .apply-btn:hover {
        background-color: #72BE44;         /* 移入时颜色 */
      }
    </style>
    <div data-include="desktop-footer"></div>

<script src="js/device-redirect.js"></script>
</body>
</html>
