<!DOCTYPE html>
<html lang="zh" data-alt-href="index-mobile.html" data-alt-label="EN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="shortcut icon" href="img/favicon.ico">
    <title>美拉科斯塔学院（TAM）| University Credits Pathway Program（UCPP）手机版</title>
    <meta name="description" content="美拉科斯塔学院（TAM）手机版，随时了解University Credits Pathway Program（UCPP）、学习项目、增值服务与校园生活，掌握北美高中与大学直录资讯。">
    <meta name="keywords" content="美拉科斯塔学院手机版,TAM,University Credits Pathway Program（UCPP）,北美高中,双学分课程,美国名校直录">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/mobile.css">
    <script src="js/layout.js" defer></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://www.tam-ucpp.com/#org",
      "name": "The Academy at MiraCosta (TAM) — UCPP",
      "url": "https://www.tam-ucpp.com/",
      "logo": "https://www.tam-ucpp.com/img/U-02(1).jpg",
      "contactPoint": [{
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "admission@tam-ucpp.com",
        "telephone": "+1-510-499-2449",
        "areaServed": ["CN", "US"],
        "availableLanguage": ["en", "zh"]
      }]
    }
    </script>
</head>
<body class="bg-white text-gray-900">
    <div data-include="mobile-header"></div>

<!-- Hero Section -->
    <section class="hero-section relative flex items-center justify-center text-center text-white">
        <div class="hero-overlay absolute inset-0"></div>
        <div class="relative z-10 px-6 py-10 space-y-6 max-w-lg">
            <h1 class="hero-title font-bold leading-tight">美拉科斯塔学院<br>The Academy</h1>
            <p class="hero-subtitle font-medium">美式高中毕业加速计划</p>
            <button class="cta-button">了解学院</button>
        </div>
    </section>

    <!-- About Section -->
    <section class="py-14 px-6 bg-white text-center">
        <div class="max-w-2xl mx-auto space-y-6">
            <h2 class="text-3xl font-bold text-gray-900">学院介绍</h2>
            <p class="text-base leading-relaxed text-gray-600">
                美拉科斯塔学院以双轨课程为核心，帮助高中生在一门课程中同时获取高中与大学学分。
                累积官方大学成绩单的同时完成高中毕业，为家庭节省时间与费用。
            </p>
        </div>
    </section>

    <!-- Feature Grid -->
    <section class="mobile-grid space-y-6 px-6 pb-16">
        <div class="panel-image" style="background-image: url('img/28b2c8_2dad88960d0d420ba09921e6598ec2dd~mv2.png');" role="img" aria-label="Students walking on campus"></div>

        <div class="panel-text scroll-fade">
            <h3>校园生活</h3>
            <p>
                在学院学习的每一天，学生都能参与多彩的课外社团与活动，打造难忘的美国校园体验。
            </p>
        </div>

        <div class="panel-text scroll-fade">
            <h3>菁英营队</h3>
            <p>
                借助优越的地理位置与专业设施，我们与学生共同完成主题项目与营队实践，深受家长好评。
            </p>
        </div>

        <div class="panel-image" style="background-image: url('img/28b2c8_1cf5076db0a64595a1c2ef6f0a5c4688~mv2.jpg');" role="img" aria-label="Beach activity"></div>
    </section>

    <!-- Accreditations Carousel -->
    <section class="accreditations-section py-16 px-6">
        <div class="max-w-3xl mx-auto">
            <div class="text-center mb-10 space-y-3">
                <h2 class="accreditations-title">权威认证机构</h2>
            </div>
            <div class="accreditations-carousel" data-autoplay-interval="3000" data-carousel-label="Accredited institutions logo carousel">
                <button class="carousel-arrow carousel-arrow--prev" type="button" aria-label="Previous accredited institution" data-direction="prev">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="w-6 h-6"><path d="M14.7 5.3a1 1 0 0 1 0 1.4L10.41 11l4.3 4.3a1 1 0 0 1-1.42 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.42 0z" fill="currentColor"/></svg>
                </button>
                <div class="carousel-viewport">
                    <ul class="carousel-track" aria-live="polite">
                        <li class="carousel-slide">
                            <img src="img/accreditations/common-app.svg" alt="The Common App accreditation logo">
                        </li>
                        <li class="carousel-slide">
                            <img src="img/accreditations/accjc.svg" alt="ACCJC accrediting commission logo">
                        </li>
                        <li class="carousel-slide">
                            <img src="img/accreditations/msa-cess.svg" alt="Middle States Association CESS accreditation logo">
                        </li>
                        <li class="carousel-slide">
                            <img src="img/accreditations/ncaa.svg" alt="NCAA member institution emblem">
                        </li>
                        <li class="carousel-slide">
                            <img src="img/accreditations/uc.svg" alt="University of California wordmark">
                        </li>
                        <li class="carousel-slide">
                            <img src="img/accreditations/uc-ag.svg" alt="University of California A-G Guide emblem">
                        </li>
                        <li class="carousel-slide">
                            <img src="img/accreditations/wasc.svg" alt="WASC accreditation seal">
                        </li>
                    </ul>
                </div>
                <button class="carousel-arrow carousel-arrow--next" type="button" aria-label="Next accredited institution" data-direction="next">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="w-6 h-6"><path d="M9.3 18.7a1 1 0 0 1 0-1.4L13.59 13l-4.3-4.3a1 1 0 0 1 1.42-1.4l5 5a1 1 0 0 1 0 1.4l-5 5a1 1 0 0 1-1.42 0z" fill="currentColor"/></svg>
                </button>
            </div>
            <div class="carousel-dots" role="tablist" aria-label="Select accredited institution"></div>
        </div>
    </section>
    <div data-include="mobile-footer"></div>
<script src="js/accreditations-carousel.js"></script>
    <script src="js/device-redirect.js"></script>
</body>
</html>
